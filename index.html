<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Mood Calendar · Трекер настроения</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --border: #e2e8f0;
      --hover: #f1f5f9;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      --radius: 20px;
      --radius-sm: 14px;
      --transition: 0.2s ease;
      --mood-red: #ef4444;
      --mood-orange: #f97316;
      --mood-yellow: #eab308;
      --mood-green: #22c55e;
      --mood-red-soft: #fee2e2;
      --mood-orange-soft: #ffedd5;
      --mood-yellow-soft: #fef9c3;
      --mood-green-soft: #dcfce7;
      --canvas-bg: #ffffff;
      --chart-grid: #e2e8f0;
    }

    body.dark {
      --bg: #0b1120;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --hover: #2d3a4f;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      --mood-red-soft: #7f1d1d;
      --mood-orange-soft: #7c2d12;
      --mood-yellow-soft: #713f12;
      --mood-green-soft: #14532d;
      --canvas-bg: #1e293b;
      --chart-grid: #334155;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background var(--transition), color var(--transition);
    }

    .app-container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 24px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background var(--transition), border var(--transition);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .stat-item {
      background: var(--hover);
      border-radius: var(--radius-sm);
      padding: 14px 10px;
      text-align: center;
      font-weight: 500;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .month-year {
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -0.3px;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--hover);
      border: none;
      border-radius: 40px;
      padding: 10px 18px;
      font-weight: 550;
      color: var(--text);
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.95rem;
      border: 1px solid transparent;
    }

    button:hover {
      background: var(--border);
      border-color: var(--text-secondary);
    }

    button.primary {
      background: #3b82f6;
      color: white;
      border: none;
      font-weight: 600;
    }

    button.primary:hover {
      background: #2563eb;
    }

    .weekdays-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr) 42px;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    .day-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s ease;
      background: transparent;
      font-size: 0.9rem;
      border: 1px solid transparent;
    }

    .day-cell:hover {
      background: var(--hover);
      border-color: var(--border);
    }

    .day-cell.other-month {
      color: #94a3b8;
      opacity: 0.55;
    }

    .day-cell.today {
      border: 2px solid #3b82f6;
      font-weight: 700;
    }

    .week-avg {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--hover);
      color: var(--text);
      margin-left: 2px;
    }

    .mood-red { background: var(--mood-red-soft); color: var(--mood-red); }
    .mood-orange { background: var(--mood-orange-soft); color: var(--mood-orange); }
    .mood-yellow { background: var(--mood-yellow-soft); color: var(--mood-yellow); }
    .mood-green { background: var(--mood-green-soft); color: var(--mood-green); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px 18px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }
    .mood-selector {
      display: flex;
      justify-content: space-around;
      margin: 18px 0;
    }
    .mood-option {
      font-size: 2.2rem;
      padding: 8px;
      border-radius: 18px;
      cursor: pointer;
      transition: 0.2s;
      opacity: 0.65;
    }
    .mood-option.selected {
      opacity: 1;
      transform: scale(1.2);
      background: var(--hover);
    }
    textarea, input {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin: 8px 0;
      font-family: inherit;
    }
    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    .chip {
      background: var(--hover);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .chip.active {
      background: #3b82f6;
      color: white;
      border-color: white;
      font-weight: 500;
    }
    canvas {
      width: 100%;
      border-radius: 16px;
      background: var(--canvas-bg);
    }
    .analytics-detail {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.95rem;
      background: var(--hover);
      padding: 12px;
      border-radius: 16px;
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <div class="top-bar">
    <h2 style="font-weight:650;">😊 Mood Calendar</h2>
    <button class="theme-toggle" id="themeToggle">🌓 Тема</button>
  </div>

  <div class="card">
    <div class="stats-grid" id="statsContainer"></div>
  </div>

  <div class="card">
    <div class="calendar-header">
      <div class="month-year" id="monthYearDisplay"></div>
      <div class="nav-btns">
        <button id="prevMonthBtn">←</button>
        <button id="nextMonthBtn">→</button>
        <button id="todayBtn">Сегодня</button>
      </div>
    </div>
    <div class="weekdays-row">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
    </div>
    <div id="calendarGrid"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px;">📈 Детальная аналитика</h3>
    <div id="analyticsNumbers" style="margin-bottom:12px; display:flex; gap:12px; flex-wrap:wrap;"></div>
    <canvas id="moodChart" height="200" style="margin-bottom:8px;"></canvas>
    <div class="analytics-detail" id="topBadReasonsContainer">
      <strong>Основные причины плохих дней:</strong> <span id="topBadReasons">—</span>
    </div>
  </div>
</div>

<div class="modal" id="moodModal">
  <div class="modal-content">
    <h3 id="modalDate"></h3>
    <div class="mood-selector" id="moodSelector">
      <span data-mood="1" class="mood-option">😞</span>
      <span data-mood="2" class="mood-option">😕</span>
      <span data-mood="3" class="mood-option">🙂</span>
      <span data-mood="4" class="mood-option">😄</span>
    </div>
    <div class="category-chips" id="categoryChips"></div>
    <textarea id="noteText" placeholder="Заметка..." rows="2"></textarea>
    <div style="display:flex; justify-content: space-between; gap:10px; margin-top:8px;">
      <button id="deleteEntryBtn">🗑 Удалить</button>
      <button class="primary" id="saveMoodBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const STORAGE_KEY = 'mood_calendar_data';
    let moodData = {};

    function loadData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        moodData = stored ? JSON.parse(stored) : {};
      } catch (e) { moodData = {}; }
    }
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(moodData));
    }

    let currentDate = new Date();
    
    // Расширенный список категорий (тем)
    const CATEGORIES = [
      'Работа', 'Учеба', 'Отношения', 'Семья', 'Здоровье', 
      'Финансы', 'Друзья', 'Отдых', 'Спорт', 'Питание',
      'Погода', 'Сон', 'Хобби', 'Путешествия', 'Другое'
    ];

    const moodMap = {
      1: { emoji: '😞', bgClass: 'mood-red' },
      2: { emoji: '😕', bgClass: 'mood-orange' },
      3: { emoji: '🙂', bgClass: 'mood-yellow' },
      4: { emoji: '😄', bgClass: 'mood-green' }
    };

    function formatDateKey(year, month, day) {
      return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    function getTodayKey() {
      const d = new Date();
      return formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
    }

    // Тема
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeToggle.innerHTML = isDark ? '☀️ Светлая' : '🌓 Тема';
      localStorage.setItem('mood_theme', isDark ? 'dark' : 'light');
      drawLineChart();
    });

    if (localStorage.getItem('mood_theme') === 'dark') {
      document.body.classList.add('dark');
      themeToggle.innerHTML = '☀️ Светлая';
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('monthYearDisplay').textContent = 
        `${currentDate.toLocaleString('ru', { month:'long' })} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      
      let startDayIndex = firstDay === 0 ? 6 : firstDay - 1;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const todayKey = getTodayKey();
      const cells = [];

      for (let i = startDayIndex-1; i >= 0; i--) {
        const day = prevMonthDays - i;
        cells.push({ day, dateKey: formatDateKey(year, month-1, day), isOtherMonth: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = formatDateKey(year, month, d);
        cells.push({ day: d, dateKey, isOtherMonth: false, isToday: dateKey === todayKey });
      }
      const totalCells = startDayIndex + daysInMonth;
      const remaining = 7 - (totalCells % 7);
      if (remaining < 7) {
        for (let d = 1; d <= remaining; d++) {
          cells.push({ day: d, dateKey: formatDateKey(year, month+1, d), isOtherMonth: true });
        }
      }

      const weeks = [];
      for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

      weeks.forEach(weekCells => {
        const weekRow = document.createElement('div');
        weekRow.className = 'week-row';
        const moodsInWeek = weekCells.map(c => moodData[c.dateKey]?.mood).filter(m => m != null);
        const avg = moodsInWeek.length ? (moodsInWeek.reduce((s,m)=>s+m,0)/moodsInWeek.length).toFixed(1) : null;

        weekCells.forEach(cell => {
          const dayDiv = document.createElement('div');
          dayDiv.className = 'day-cell';
          if (cell.isOtherMonth) dayDiv.classList.add('other-month');
          if (cell.isToday) dayDiv.classList.add('today');
          const entry = moodData[cell.dateKey];
          if (entry?.mood && moodMap[entry.mood]) dayDiv.classList.add(moodMap[entry.mood].bgClass);
          dayDiv.textContent = cell.day;
          dayDiv.addEventListener('click', () => openModal(cell.dateKey));
          weekRow.appendChild(dayDiv);
        });

        const avgDiv = document.createElement('div');
        avgDiv.className = 'week-avg';
        avgDiv.textContent = avg !== null ? avg : '·';
        if (avg !== null) {
          const num = parseFloat(avg);
          if (num >= 3.5) avgDiv.style.background = 'var(--mood-green-soft)';
          else if (num >= 2.5) avgDiv.style.background = 'var(--mood-yellow-soft)';
          else if (num >= 1.5) avgDiv.style.background = 'var(--mood-orange-soft)';
          else avgDiv.style.background = 'var(--mood-red-soft)';
        }
        weekRow.appendChild(avgDiv);
        grid.appendChild(weekRow);
      });

      updateStatsAndAnalytics();
    }

    let currentModalDate = null, selectedMood = null, selectedCategories = [];
    const modal = document.getElementById('moodModal');
    const noteText = document.getElementById('noteText');
    const categoryChips = document.getElementById('categoryChips');

    function openModal(dateKey) {
      currentModalDate = dateKey;
      document.getElementById('modalDate').textContent = `📅 ${dateKey}`;
      const entry = moodData[dateKey] || {};
      selectedMood = entry.mood || null;
      noteText.value = entry.note || '';
      selectedCategories = entry.categories ? [...entry.categories] : [];
      renderMoodSelector();
      renderCategoryChips();
      modal.classList.add('active');
    }

    function renderMoodSelector() {
      document.querySelectorAll('#moodSelector .mood-option').forEach(opt => {
        opt.classList.toggle('selected', parseInt(opt.dataset.mood) === selectedMood);
      });
    }

    function renderCategoryChips() {
      categoryChips.innerHTML = CATEGORIES.map(cat => {
        const active = selectedCategories.includes(cat);
        return `<span class="chip ${active ? 'active' : ''}" data-cat="${cat}">${cat}</span>`;
      }).join('');
      document.querySelectorAll('#categoryChips .chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          const cat = e.target.dataset.cat;
          selectedCategories = selectedCategories.includes(cat) 
            ? selectedCategories.filter(c => c !== cat) 
            : [...selectedCategories, cat];
          renderCategoryChips();
        });
      });
    }

    document.getElementById('moodSelector').addEventListener('click', (e) => {
      if (e.target.dataset.mood) { 
        selectedMood = parseInt(e.target.dataset.mood); 
        renderMoodSelector(); 
      }
    });

    document.getElementById('saveMoodBtn').addEventListener('click', () => {
      if (!currentModalDate || !selectedMood) return;
      const now = new Date().toISOString();
      const existing = moodData[currentModalDate] || {};
      moodData[currentModalDate] = {
        mood: selectedMood,
        note: noteText.value.trim(),
        categories: selectedCategories,
        createdAt: existing.createdAt || now,
        updatedAt: now
      };
      saveData();
      modal.classList.remove('active');
      renderCalendar();
    });

    document.getElementById('deleteEntryBtn').addEventListener('click', () => {
      if (currentModalDate && moodData[currentModalDate]) {
        delete moodData[currentModalDate];
        saveData();
        modal.classList.remove('active');
        renderCalendar();
      }
    });

    window.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    function updateStatsAndAnalytics() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const monthKeys = [];
      for (let d=1; d<=daysInMonth; d++) monthKeys.push(formatDateKey(year, month, d));
      const monthEntries = monthKeys.map(k => moodData[k]).filter(e => e?.mood);
      const fillPercent = Math.round((monthEntries.length / daysInMonth)*100);
      const monthAvg = monthEntries.length ? (monthEntries.reduce((s,e)=>s+e.mood,0)/monthEntries.length).toFixed(1) : '—';
      
      const last7 = [];
      for (let i=6; i>=0; i--) {
        const d = new Date(); d.setDate(d.getDate()-i);
        const e = moodData[formatDateKey(d.getFullYear(), d.getMonth(), d.getDate())];
        if (e?.mood) last7.push(e.mood);
      }
      const weekAvg = last7.length ? (last7.reduce((a,b)=>a+b,0)/last7.length).toFixed(1) : '—';
      
      let streak = 0;
      const today = new Date();
      for (let i=0; i<365; i++) {
        const d = new Date(today); d.setDate(d.getDate()-i);
        if (moodData[formatDateKey(d.getFullYear(), d.getMonth(), d.getDate())]?.mood) streak++; else break;
      }

      document.getElementById('statsContainer').innerHTML = `
        <div class="stat-item">📆 Неделя <br><span style="color:${getAvgColor(weekAvg)}">${weekAvg}</span></div>
        <div class="stat-item">📅 Месяц <br><span style="color:${getAvgColor(monthAvg)}">${monthAvg}</span></div>
        <div class="stat-item">📋 Заполнено <br>${monthEntries.length}/${daysInMonth} (${fillPercent}%)</div>
        <div class="stat-item">🔥 Серия <br>${streak} дн.</div>
      `;

      const counts = {1:0,2:0,3:0,4:0};
      Object.values(moodData).forEach(e => { if (e.mood) counts[e.mood]++; });
      document.getElementById('analyticsNumbers').innerHTML = 
        `🔴 Очень плохо: ${counts[1]}  🟠 Плохо: ${counts[2]}  🟡 Нормально: ${counts[3]}  🟢 Хорошо: ${counts[4]}`;
      
      drawLineChart();
      findTopBadReasons();
    }

    function getAvgColor(val) {
      if (val === '—') return 'gray';
      const n = parseFloat(val);
      if (n >= 3.5) return 'var(--mood-green)';
      if (n >= 2.5) return 'var(--mood-yellow)';
      if (n >= 1.5) return 'var(--mood-orange)';
      return 'var(--mood-red)';
    }

    function drawLineChart() {
      const canvas = document.getElementById('moodChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.clientWidth || 400;
      canvas.width = width;
      canvas.height = 200;

      const style = getComputedStyle(document.body);
      const textColor = style.getPropertyValue('--text');
      const gridColor = style.getPropertyValue('--chart-grid');

      ctx.clearRect(0, 0, width, 200);
      
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      
      const allDays = [];
      for (let d=1; d<=daysInMonth; d++) {
        const key = formatDateKey(year, month, d);
        allDays.push({ day: d, mood: moodData[key]?.mood || null });
      }

      const padding = { left: 40, right: 20, top: 20, bottom: 35 };
      const chartW = width - padding.left - padding.right;
      const chartH = 200 - padding.top - padding.bottom;

      ctx.fillStyle = textColor;
      ctx.font = '11px Inter, sans-serif';
      for (let moodVal = 1; moodVal <= 4; moodVal++) {
        const y = padding.top + chartH - ((moodVal-1) / 3) * chartH;
        ctx.beginPath();
        ctx.strokeStyle = gridColor;
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        ctx.fillText(['','😞','😕','🙂','😄'][moodVal], 5, y+4);
      }

      if (allDays.length > 0) {
        ctx.beginPath();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2.5;
        let first = true;
        allDays.forEach((item, i) => {
          if (item.mood === null) { first = true; return; }
          const x = padding.left + (i / (daysInMonth-1)) * chartW;
          const y = padding.top + chartH - ((item.mood-1)/3) * chartH;
          if (first) { ctx.moveTo(x, y); first = false; }
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        allDays.forEach((item, i) => {
          if (item.mood === null) return;
          const x = padding.left + (i / (daysInMonth-1)) * chartW;
          const y = padding.top + chartH - ((item.mood-1)/3) * chartH;
          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, 2*Math.PI);
          ctx.fillStyle = '#3b82f6';
          ctx.fill();
        });
      }

      ctx.fillStyle = textColor;
      ctx.font = 'bold 11px Inter';
      ctx.fillText('1', padding.left-5, 200-8);
      ctx.fillText(`${daysInMonth}`, width-padding.right-12, 200-8);
      ctx.fillText('Начало', padding.left-15, 200-20);
      ctx.fillText('Конец', width-padding.right-35, 200-20);
    }

    function findTopBadReasons() {
      const badReasons = {};
      Object.values(moodData).forEach(e => {
        if (e.mood && e.mood <= 2 && e.categories) {
          e.categories.forEach(c => badReasons[c] = (badReasons[c] || 0) + 1);
        }
      });
      const sorted = Object.entries(badReasons).sort((a,b) => b[1] - a[1]);
      const top3 = sorted.slice(0, 3).map(([cat, count]) => `${cat} (${count})`).join(', ');
      document.getElementById('topBadReasons').textContent = top3 || '—';
    }

    document.getElementById('prevMonthBtn').addEventListener('click', ()=>{ 
      currentDate.setMonth(currentDate.getMonth()-1); 
      renderCalendar(); 
    });
    document.getElementById('nextMonthBtn').addEventListener('click', ()=>{ 
      currentDate.setMonth(currentDate.getMonth()+1); 
      renderCalendar(); 
    });
    document.getElementById('todayBtn').addEventListener('click', ()=>{ 
      currentDate = new Date(); 
      renderCalendar(); 
    });

    loadData();
    renderCalendar();
  })();
</script>
</body>
</html>
